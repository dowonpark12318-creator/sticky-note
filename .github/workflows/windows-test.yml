name: Windows test build

on:
  push:
    branches: [codex/windows-test-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - name: Install browser for translation and tutorial checks
        run: npx playwright install chromium
      - name: Test memo gestures and delayed double-click return
        run: npm run test:ui
      - name: Test translation and first-run tutorial with a mock provider
        run: npm run test:features
      - name: Test automatic Korean and English UI
        run: npm run test:locales

      - name: Test the Windows desktop app
        id: desktop
        timeout-minutes: 5
        env:
          ELECTRON_TEST_NO_SANDBOX: '0'
        shell: pwsh
        run: |
          $desktopErrorPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            npm run test:desktop 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-desktop-test.log"
            $desktopExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $desktopErrorPreference
          }
          exit $desktopExitCode

      - name: Package the Windows app
        run: npm run pack:win

      - name: Build and install-test the development MSIX
        id: msix
        timeout-minutes: 5
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'msix-build-test.log'
          try {
            $savedErrorPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              npm run pack:msix:dev 2>&1 | Tee-Object -FilePath $log
              $buildExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedErrorPreference
            }
            if ($buildExitCode -ne 0) { throw "MSIX build failed with exit code $buildExitCode." }
            & ./scripts/test-msix-install.ps1 -PackagePath dist/CornerNote-Development-x64.msix 2>&1 | Tee-Object -FilePath $log -Append
          } catch {
            $details = ((Get-Content -LiteralPath $log -Tail 100 | Out-String) + $_.Exception.ToString()).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=MSIX build or installation check failed::$details"
            throw
          }

      - name: Upload MSIX validation log
        if: always() && steps.msix.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: MSIX-validation-log
          path: ${{ runner.temp }}/msix-build-test.log
          retention-days: 14

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: CornerNote-Windows-x64
          path: dist/CornerNote-win32-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test failure log
        if: always() && steps.desktop.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-test-log
          path: ${{ runner.temp }}/windows-desktop-test.log
          retention-days: 14

      - name: Publish a directly downloadable test release
        if: success() && steps.desktop.outcome == 'success' && steps.msix.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "windows-test-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $notes = Join-Path $env:RUNNER_TEMP 'corner-note-release.md'
          @'
          Windows 10/11 64비트용 모서리 메모 테스트 앱입니다.

          CornerNote-Windows-x64.zip을 모두 압축 해제하고, CornerNote-win32-x64 폴더 안의 CornerNote.exe를 실행하세요. Node.js 설치와 GitHub 로그인이 필요하지 않습니다.

          v1.5.0: Windows 기본 설정 언어에 따라 한국어 또는 영어로 메뉴·도움말·튜토리얼·번역 UI·날짜·삭제 확인창을 표시합니다. 그 외 언어의 UI는 영어로 표시하며, 컴퓨터의 실제 언어는 기본 번역 대상에 유지됩니다. 작성한 메모는 자동 번역하지 않습니다.

          설명서는 압축 해제한 폴더의 Help/manual.html에서 열 수 있으며 브라우저의 기본 언어에 맞춰 표시됩니다. 제목 표시줄은 ? + − × 순서입니다. 기존 여러 메모·접기·크기 조절·AI 번역 기능도 유지됩니다.

          CornerNote-Development-x64.msix는 테스트용 식별정보를 사용하는 서명되지 않은 개발 빌드입니다. Store 제출용 또는 일반 더블클릭 설치용 파일이 아닙니다. Windows SDK 패키지 검증과 임시 인증서를 사용한 실제 설치·영어/한국어 실행 검사를 통과했습니다. 임시 인증서와 개인 키는 다운로드에 포함하지 않습니다. Store 제출용 빌드는 Partner Center의 실제 앱 식별정보가 필요하며, store/MSIX.md에 절차가 있습니다.

          이전 앱을 트레이 메뉴에서 종료한 뒤 새 ZIP을 새 폴더에 모두 풀어 실행하세요. AI 번역에는 본인 OpenAI API 키가 필요하고 ChatGPT 구독과 별도로 사용료가 발생할 수 있습니다. 자동 번역 검사는 모의 응답을 사용하며 실제 OpenAI 응답과 청구를 검증하지 않았습니다.

          Automatic Korean/English UI, help, tutorial, translation menus and offline manual. Other display languages fall back to English; note text is never translated automatically. Extract the portable ZIP and run CornerNote.exe. Help/manual.html opens the local user guide.

          The unsigned Development MSIX is a validation artifact, not a Store submission or a normal double-click installer. Windows packaging and temporary-certificate installation/activation checks passed. Real Partner Center identity is required for a Store build. The portable build is unsigned and may show Windows SmartScreen warnings.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create "$tag" "dist/CornerNote-Windows-x64.zip" "dist/CornerNote-Windows-x64.zip.sha256" "dist/CornerNote-Development-x64.msix" "dist/CornerNote-Development-x64.msix.sha256" "dist/CornerNote-Development-x64.msix.json" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --latest=false --title "모서리 메모 Windows 테스트 $env:GITHUB_RUN_NUMBER" --notes-file "$notes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "다운로드: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/CornerNote-Windows-x64.zip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report desktop test failure
        if: always() && steps.desktop.outcome == 'failure'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-desktop-test.log'
          '### Windows desktop test failure' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log -Tail 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $details = (Get-Content -LiteralPath $log -Tail 60 | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop test details::$details"
          }
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Error 'Windows desktop tests failed. Inspect Windows-desktop-test-log and the job summary before testing.'
          exit 1
