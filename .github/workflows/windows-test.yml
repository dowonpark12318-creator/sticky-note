name: Windows test build

on:
  push:
    branches: [codex/windows-test-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup

      - name: Capture real Windows Store screenshots
        id: captures
        timeout-minutes: 12
        env:
          ELECTRON_TEST_NO_SANDBOX: '0'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'store-materials.log'
          try {
            $captureErrorPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              npm run store:screenshots 2>&1 | Tee-Object -FilePath $log
              $captureExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $captureErrorPreference
            }
            if ($captureExitCode -ne 0) { throw "Store screenshot capture failed with exit code $captureExitCode." }
          } catch {
            $exception = $_.Exception.ToString()
            $tail = (Get-Content -LiteralPath $log -Tail 15 | Out-String)
            if ($tail.Length -gt 1600) { $tail = $tail.Substring($tail.Length - 1600) }
            $details = ($exception + "`n" + $tail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Store desktop capture failed::$details"
            throw
          }
      - run: npm test
      - name: Install browser for translation and tutorial checks
        run: npx playwright install chromium
      - name: Test memo gestures and delayed double-click return
        run: npm run test:ui
      - name: Test translation and first-run tutorial with a mock provider
        run: npm run test:features
      - name: Test automatic display languages
        run: npm run test:locales

      - name: Test the Windows desktop app
        id: desktop
        timeout-minutes: 5
        env:
          ELECTRON_TEST_NO_SANDBOX: '0'
        shell: pwsh
        run: |
          $desktopErrorPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            npm run test:desktop 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/windows-desktop-test.log"
            $desktopExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $desktopErrorPreference
          }
          exit $desktopExitCode

      - name: Package the Windows app
        run: npm run pack:win

      - name: Build MSIX packages and test the installed app
        id: msix
        timeout-minutes: 5
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'msix-build-test.log'
          try {
            $savedErrorPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              npm run pack:msix:dev 2>&1 | Tee-Object -FilePath $log
              $buildExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedErrorPreference
            }
            if ($buildExitCode -ne 0) { throw "MSIX build failed with exit code $buildExitCode." }
            & ./scripts/test-msix-install.ps1 -PackagePath dist/CornerNote-Development-x64.msix 2>&1 | Tee-Object -FilePath $log -Append
            try {
              $ErrorActionPreference = 'Continue'
              npm run pack:msix 2>&1 | Tee-Object -FilePath $log -Append
              $storeExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedErrorPreference
            }
            if ($storeExitCode -ne 0) { throw "Store MSIX build failed with exit code $storeExitCode." }
          } catch {
            $exception = $_.Exception.ToString()
            $tail = (Get-Content -LiteralPath $log -Tail 15 | Out-String)
            if ($tail.Length -gt 1600) { $tail = $tail.Substring($tail.Length - 1600) }
            $details = ($exception + "`n" + $tail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=MSIX build or installation check failed::$details"
            throw
          }

      - name: Package Store registration materials
        id: materials
        timeout-minutes: 3
        env:
          ELECTRON_TEST_NO_SANDBOX: '0'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'store-materials.log'
          try {
            $savedErrorPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = 'Continue'
              npm run store:materials 2>&1 | Tee-Object -FilePath $log -Append
              $materialsExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $savedErrorPreference
            }
            if ($materialsExitCode -ne 0) { throw "Store materials validation failed with exit code $materialsExitCode." }
          } catch {
            $exception = $_.Exception.ToString()
            $tail = (Get-Content -LiteralPath $log -Tail 15 | Out-String)
            if ($tail.Length -gt 1600) { $tail = $tail.Substring($tail.Length - 1600) }
            $details = ($exception + "`n" + $tail).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Store material generation failed::$details"
            throw
          }

      - name: Upload Store material failure log
        if: always() && (steps.captures.outcome == 'failure' || steps.materials.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: Store-material-generation-log
          path: ${{ runner.temp }}/store-materials.log
          retention-days: 14

      - name: Upload MSIX validation log
        if: always() && steps.msix.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: MSIX-validation-log
          path: ${{ runner.temp }}/msix-build-test.log
          retention-days: 14

      - name: Upload the portable app
        uses: actions/upload-artifact@v4
        with:
          name: CornerNote-Windows-x64
          path: dist/CornerNote-win32-x64/
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop test failure log
        if: always() && steps.desktop.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-desktop-test-log
          path: ${{ runner.temp }}/windows-desktop-test.log
          retention-days: 14

      - name: Publish a directly downloadable test release
        if: success() && steps.captures.outcome == 'success' && steps.desktop.outcome == 'success' && steps.msix.outcome == 'success' && steps.materials.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "windows-test-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $notes = Join-Path $env:RUNNER_TEMP 'corner-note-release.md'
          @'
          CornerNote v1.6.0 — Windows 10/11 x64

          이번 업데이트:
          - 본문을 스크롤한 상태에서도 제목 표시줄을 드래그해 메모를 옮길 수 있습니다.
          - 항상 위 설정과 Alt+Tab 표시 여부를 메모마다 독립적으로 저장합니다.
          - 메모 제목을 클릭해 변경할 수 있습니다. Enter 또는 다른 곳을 클릭하면 저장하고, Esc로 취소합니다. 제목을 비우면 기본 이름을 사용합니다.
          - 기존 메모 내용·위치·색상·접힘 상태를 유지합니다. 10개 언어의 도움말도 업데이트했습니다.

          테스트용 실행 파일: CornerNote-Windows-x64.zip을 새 폴더에 모두 압축 해제하고 CornerNote-win32-x64/CornerNote.exe를 실행하세요. 실행 중인 이전 앱은 트레이 메뉴에서 먼저 종료하세요. Node.js 설치와 GitHub 로그인이 필요하지 않습니다.

          스토어 업데이트 제출용: CornerNote-Store-x64.msix는 Partner Center 식별정보 DowonPark.CornerNote / Dowon Park를 사용하는 버전 1.6.0.0의 unsigned 패키지입니다. Partner Center에 업데이트로 제출하세요. 이 GitHub 릴리스는 Microsoft Store에 업데이트를 자동 게시하지 않습니다.

          CornerNote-Development-x64.msix는 임시 인증서로 Windows 설치·영어/한국어 실행 검사를 수행하기 위한 개발 패키지입니다. 다운로드 파일은 서명되지 않았으며 일반 더블클릭 설치용이 아닙니다. 임시 인증서와 개인 키는 포함하지 않습니다.

          CornerNote-Store-Materials.zip: 10개 언어 소개문·실제 Windows 스크린샷 40장·아이콘·개인정보처리방침·지원 안내. 선택 사항인 검색어는 비워 두었습니다. AI 번역은 개인 OpenAI API 키가 필요하며 별도 이용료가 발생할 수 있습니다. 자동 번역 검사는 모의 응답을 사용합니다.

          Fixes expanded-note dragging while scrolled, saves always-on-top independently for each note, and adds editable note titles. Existing notes and positions are preserved. Extract the portable ZIP to test, or upload the Store MSIX (1.6.0.0) as a Partner Center update. This GitHub release does not publish the update to Microsoft Store. The portable build is unsigned and Windows may show SmartScreen. AI translation requires a personal OpenAI API key and separate API charges may apply.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          gh release create "$tag" "dist/CornerNote-Windows-x64.zip" "dist/CornerNote-Windows-x64.zip.sha256" "dist/CornerNote-Development-x64.msix" "dist/CornerNote-Development-x64.msix.sha256" "dist/CornerNote-Development-x64.msix.json" "dist/CornerNote-Store-x64.msix" "dist/CornerNote-Store-x64.msix.sha256" "dist/CornerNote-Store-x64.msix.json" "dist/CornerNote-Store-Materials.zip" "dist/CornerNote-Store-Materials.zip.sha256" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --prerelease --latest=false --title "모서리 메모 Windows 테스트 $env:GITHUB_RUN_NUMBER" --notes-file "$notes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "다운로드: https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/CornerNote-Windows-x64.zip" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Report desktop test failure
        if: always() && steps.desktop.outcome == 'failure'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'windows-desktop-test.log'
          '### Windows desktop test failure' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log -Tail 160 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            $details = (Get-Content -LiteralPath $log -Tail 60 | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop test details::$details"
          }
          '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Error 'Windows desktop tests failed. Inspect Windows-desktop-test-log and the job summary before testing.'
          exit 1
